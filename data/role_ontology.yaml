# role_ontology.yaml  [GEMOCKT/KURATIERT]
# 28 roles: 10 from the data pack owner table (source: pack), 18 plant roles (source: plant).
# Curated wording, no real people, no real plant data. catalog_support decides whether a contract can be built (none -> honest refusal).
- role: BI Platform Owner
  source: pack
  example_decision: which workspace stays certified
  example_signal: failed refresh on a certified model
  example_action: pause the certificate and tell the owner
  example_escalation:
  - Semantic Model Owner
  upstream: []
  downstream:
  - Semantic Model Owner
  vocabulary:
  - workspace
  - certificate
  - refresh
  catalog_support: monthly
